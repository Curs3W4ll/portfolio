---
license:
  stage: lint
  image: alpine:3.24.2
  needs: []
  dependencies: []
  extends:
    - .default-retry
    - .interruptible
  rules:
    - !reference [".license:rules", rules]
  variables:
    # Overridden to the source branch by .license:rules on merge requests.
    BRANCH: $CI_COMMIT_BRANCH
  before_script:
    - apk add --no-cache bash curl
  script:
    # Single-quoted: the `: ` in the header would otherwise start a YAML mapping.
    # yamllint disable-line rule:line-length
    - 'curl -fsSL -H "Cache-Control: no-cache" -o /tmp/install-fossa.sh "https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh"'
    - bash /tmp/install-fossa.sh
    - fossa analyze -b "$BRANCH" -t "Portfolio" -P "$CI_PROJECT_URL"
    - fossa test
