---
lint:
  stage: lint
  needs: []
  dependencies: []
  extends:
    - .default-retry
    - .interruptible
    - .toolset:lint
  cache:
    - !reference [".mise-cache", cache]
    - !reference [".pre-commit-cache", cache]
    - !reference [".npm-cache", cache]
  rules:
    - !reference [".lint:rules", rules]
  variables:
    # Full history, so pre-commit can diff against CI_MERGE_REQUEST_DIFF_BASE_SHA.
    # The runner's default shallow clone has no merge base to reach.
    GIT_DEPTH: "0"
  before_script:
    - !reference [".mise-before_script", before_script]
    - !reference [".npm-before_script", before_script]
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        mise run pre-commit:run -- "$CI_MERGE_REQUEST_DIFF_BASE_SHA" "$CI_COMMIT_SHA"
      else
        mise run pre-commit:run:all
      fi
