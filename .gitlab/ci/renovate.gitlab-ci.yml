---
# Self-hosted Renovate, configured by renovate.json5 at the repository root.
# Runs only on the `SCHEDULE_TASK=renovate` pipeline schedule
# (terraform/live/pipeline-schedule-renovate); no other job matches that
# schedule, so its pipeline runs this job alone.

renovate:
  stage: maintenance
  image:
    name: renovate/renovate:44.134.1
    entrypoint: [""]
  needs: []
  dependencies: []
  extends:
    - .default-retry
    - .not-interruptible
  rules:
    - !reference [".renovate:rules", rules]
  variables:
    LOG_LEVEL: info
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_AUTODISCOVER: false # Disable Renovate "scan every repo I can see" mode
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_GIT_AUTHOR: "Renovate Bot <$RENOVATE_GIT_AUTHOR_EMAIL>"
  script:
    - renovate
