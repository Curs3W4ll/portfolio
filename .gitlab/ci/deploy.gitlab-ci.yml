---
pages:
  stage: deploy
  needs:
    - job: lint
      optional: true
    - job: test:e2e
      optional: true
  dependencies: []
  extends:
    - .default-retry
    - .not-interruptible
    - .toolset:node
  cache:
    - !reference [".mise-cache", cache]
    - !reference [".npm-cache", cache]
  rules:
    - !reference [".deploy:rules", rules]
  variables:
    SENTRY_AUTH_TOKEN: $CUSTOM_SENTRY_AUTH_TOKEN
    NUXT_SENTRY_RELEASE: $CI_COMMIT_TAG
  before_script:
    - !reference [".mise-before_script", before_script]
    # Ahead of `npm ci`, whose postinstall runs `nuxt prepare`.
    - cp "$PRODUCTION_ENV_FILE" .env
    - echo -e "\nNUXT_PUBLIC_VERSION=${CI_COMMIT_TAG}\n" >> .env
    - !reference [".npm-before_script", before_script]
  script:
    - npm run generate
  artifacts:
    paths:
      - .output/public
    expire_in: never
  publish: .output/public
  environment:
    name: production
    url: https://hervaud.fr
    deployment_tier: production
