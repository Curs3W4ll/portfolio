---
# Shared foundations for all jobs. Hidden jobs (keys prefixed with `.`) are
# consumed from sibling files via `extends:` or `!reference [...]` — YAML
# anchors do not cross the wildcard include in .gitlab-ci.yml, so everything
# reusable across files is expressed as a hidden job.

default:
  # The `-debian` flavor, not the bare tag: the bare tag is a ~40 MB minimal
  # image with no shell at all, which the runner cannot start a job in.
  #
  # entrypoint: [""] overrides the image's ENTRYPOINT (mise), otherwise the
  # runner would launch the job script as `mise <script>` and mise would reject
  # it. Jobs that bring their own image (alpine for `license`, cypress/base for
  # `test:e2e`, the dependabot component's own) override this.
  image:
    name: jdxcode/mise:2026.9.18-debian
    entrypoint: [""]

variables:
  # mise's and pre-commit's stores default to $HOME, which is outside
  # CI_PROJECT_DIR and therefore impossible for GitLab CI to cache.
  MISE_DATA_DIR: $CI_PROJECT_DIR/.mise-data
  PRE_COMMIT_HOME: $CI_PROJECT_DIR/.pre-commit-data
  # Loads mise.ci.toml on top of mise.toml, and leaves mise.dev.toml
  MISE_ENV: ci
  MISE_YES: "1"

.default-retry:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure

.interruptible:
  interruptible: true

.not-interruptible:
  interruptible: false

# Per-job tool sets. Adding a tool to mise.toml does not make it available to a
# job — add it to the sets that need it
.toolset:node:
  variables:
    TOOLSET: node
    TOOLSET_TOOLS: "node"

.toolset:lint:
  variables:
    TOOLSET: lint
    TOOLSET_TOOLS: "node python pre-commit shellcheck markdownlint-cli2 pipx pipx:yamllint"

# Base before_script: install the job's mise-managed tools and put them on PATH.
# Pair it with one of the `.toolset:*` sets above.
.mise-before_script:
  before_script:
    - mise trust --yes
    # Unquoted: TOOLSET_TOOLS is a space-separated list that must word-split.
    - mise install $TOOLSET_TOOLS
    # Activate mise's managed env (PATH with the installed tools) into the shell
    # so subsequent script lines can call tools directly without a
    # `mise exec --` prefix.
    - eval "$(mise env -s bash)"

.npm-before_script:
  before_script:
    - npm ci

.mise-cache:
  cache:
    key:
      files:
        - mise.toml
        - mise.ci.toml
      # One archive per tool set. Sharing a key across sets means the last job to
      # finish overwrites the archive with its own subset, and the next pipeline
      # reinstalls from scratch.
      prefix: $TOOLSET
    paths:
      - $MISE_DATA_DIR/
    policy: pull-push

.pre-commit-cache:
  cache:
    key:
      files:
        - .pre-commit-config.yaml
    paths:
      - $PRE_COMMIT_HOME/
    policy: pull-push

.npm-cache:
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .nuxt/
      - .npm
    policy: pull-push
